{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoreLink</title>
  <link rel="icon" type="image/png" href="{% static 'AppStoreLink/images/icon-dark.png' %}">
  <link rel="stylesheet" href="{% static 'AppStoreLink/styles/style.css' %}">
</head>

<body>

  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
    }
  </script>

  <div class="topbar">
    <div class="logo-icon"><img src="{% static 'AppStoreLink/images/icon-dark.png' %}" alt="StoreLink"></div>
    <a class="nav-btn active" href="{% url 'index' %}" onclick="location.href=this.dataset.url">Início</a>    
    <a class="nav-btn" href="{% url 'perfil-loja' %}">Sua loja</a>
    <a class="nav-btn" id="suporte">Suporte</a>
    <a class="nav-btn" onclick="setActiveNav(this)">Como navegar?</a>
    {% if request.user.is_authenticated %}
    <button class="nav-account-btn" data-url="{% url 'perfil-consumidor' %}" onclick="location.href=this.dataset.url">👤 Minha conta</button>
    {% else %}
    <button class="nav-account-btn" data-url="{% url 'cadastro' %}" onclick="location.href=this.dataset.url">Criar conta ou Entrar</button>
    {% endif %}
    <button class="theme-toggle" onclick="toggleTheme(this)">🌙 Modo escuro</button>
  </div>

  <div class="sidebar-trigger"></div>
  <div class="sidebar">
    <button class="cat-btn cat-alimentos">Alimentos</button>
    <button class="cat-btn cat-moda">Moda</button>
    <button class="cat-btn cat-esportes">Esportes</button>
    <button class="cat-btn cat-construcao">Construção</button>
    <button class="cat-btn cat-saude">Saúde</button>
    <button class="cat-btn cat-pets">Pets</button>
    <button class="cat-btn cat-ambiente">Ambiente</button>
    <button class="cat-btn cat-tecnologia">Tecnologia</button>
    <button class="cat-btn cat-beleza">Beleza</button>
    <button class="cat-btn cat-outros">Outros</button>
  </div>

  <div class="main">
    <img class="logo-img logo-light" src="{% static 'AppStoreLink/images/logo-light.png' %}" alt="StoreLink"><img class="logo-img logo-dark" src="{% static 'AppStoreLink/images/logo-dark.png' %}" alt="StoreLink">
    <div class="search-container">
      <button class="search-icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <input type="text" class="search-input" placeholder="Pesquisar...">
    </div>

    <div class="hint-text">Pesquise alguma loja ou produto que deseje...</div>
  </div>

  <script src="{% static 'AppStoreLink/scripts/index.js' %}"></script>

</body>

</html>
