{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StoreLink - Criar Conta</title>

<link
  rel="icon"
  type="image/png"
  href="{% static 'AppStoreLink/images/icon-dark.png' %}"
>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>

<link
  rel="stylesheet"
  href="{% static 'AppStoreLink/styles/cadastro.css' %}"
>

<link
  rel="stylesheet"
  href="{% static 'AppStoreLink/styles/mensagens.css' %}"
>


<style>

  .auth-side {
    position: relative;
    overflow: hidden;
    background: #292d30;
  }


  .auth-side-art {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }


  .auth-side-content,
  .auth-side-icon {
    position: relative;
    z-index: 4;
  }


  .auth-side-icon {
    position: absolute;
  }


  .auth-art-line {
    position: absolute;
    top: -75%;
    width: 22px;
    height: 250%;
    transform: rotate(29deg);
    transform-origin: center;
    z-index: 1;
  }


  .art-yellow {
    left: -5%;
    background: #f6c344;
  }


  .art-red {
    left: 20%;
    background: #f25550;
  }


  .art-green {
    left: 45%;
    background: #56d01d;
  }


  .art-purple {
    left: 70%;
    background: #7658e8;
  }


  .art-blue {
    left: 95%;
    background: #35afe5;
  }


  .art-cyan {
    left: 120%;
    background: #28c4c4;
  }


  .art-orange {
    left: 145%;
    background: #f5943a;
  }


  .auth-art-icon {
    position: absolute;
    z-index: 3;
    font-size: 58px;
    line-height: 1;
  }


  .art-tools {
    top: 14%;
    left: 6%;
    color: #f6c344;
  }


  .art-flower {
    top: 10%;
    left: 53%;
    color: #56d01d;
  }


  .art-health {
    top: 55%;
    left: 77%;
    color: #35afe5;
  }


  .art-laptop {
    bottom: 10%;
    left: 33%;
    color: #7658e8;
  }


  .art-ball {
    bottom: 8%;
    right: 8%;
    color: #f5943a;
  }


  .theme-toggle .bi {
    font-size: 15px;
    line-height: 1;
  }

</style>

</head>


<body>


<!-- #region modo escuro -->

<script>

  if (
    localStorage.getItem('theme') === 'dark'
  ) {

    document.body.classList.add('dark');

  }

</script>


<button
  type="button"
  class="theme-toggle"
  onclick="toggleTheme(this)"
>

  <i
    class="bi bi-moon-fill"
    aria-hidden="true"
  ></i>

  <span class="theme-label">
    Modo escuro
  </span>

</button>

<!-- #endregion -->


<!-- #region mensagens -->

{% if messages %}

  <div class="messages-container">

    {% for message in messages %}

      <div class="alert alert-{{ message.tags }}">
        {{ message }}
      </div>

    {% endfor %}

  </div>

{% endif %}

<!-- #endregion -->


<!-- #region cadastro -->

<div class="auth-wrapper">


  <div class="auth-side">


    <!-- #region arte lateral -->

    <div class="auth-side-art">


      <span class="auth-art-line art-yellow"></span>
      <span class="auth-art-line art-red"></span>
      <span class="auth-art-line art-green"></span>
      <span class="auth-art-line art-purple"></span>
      <span class="auth-art-line art-blue"></span>
      <span class="auth-art-line art-cyan"></span>
      <span class="auth-art-line art-orange"></span>


      <i
        class="bi bi-tools auth-art-icon art-tools"
        aria-hidden="true"
      ></i>


      <i
        class="bi bi-flower1 auth-art-icon art-flower"
        aria-hidden="true"
      ></i>


      <i
        class="bi bi-heart-pulse auth-art-icon art-health"
        aria-hidden="true"
      ></i>


      <i
        class="bi bi-laptop auth-art-icon art-laptop"
        aria-hidden="true"
      ></i>


      <i
        class="bi bi-dribbble auth-art-icon art-ball"
        aria-hidden="true"
      ></i>


    </div>

    <!-- #endregion -->


    <button
      type="button"
      class="auth-side-icon"
      data-url="{% url 'index' %}"
      onclick="location.href=this.dataset.url"
      aria-label="Voltar para o início"
    >

      <img
        class="side-icon-light"
        src="{% static 'AppStoreLink/images/icon.png' %}"
        alt="StoreLink"
      >

      <img
        class="side-icon-dark"
        src="{% static 'AppStoreLink/images/icon-dark.png' %}"
        alt="StoreLink"
      >

    </button>


    <div class="auth-side-content">

      <h1>
        Bem Vindo de Volta&nbsp;!
      </h1>

      <p>
        Insira seus dados pessoais para acessar sua conta
      </p>

      <a
        class="auth-btn-outline"
        href="{% url 'login' %}"
      >
        ENTRAR
      </a>

    </div>


  </div>


  <div class="auth-form-side">


    <div class="auth-form-box">


      <h2>
        Criar Conta
      </h2>


      <button
        type="button"
        class="auth-google-btn"
        aria-label="Cadastrar com Google"
      >

        <img
          src="{% static 'AppStoreLink/images/google-plus.png' %}"
          alt="Google+"
        >

      </button>


      <form
        class="auth-form"
        method="POST"
        action=""
      >

        {% csrf_token %}


        <!-- #region nome -->

        <label class="auth-field">

          <img
            class="field-icon-light"
            src="{% static 'AppStoreLink/images/do-utilizador.png' %}"
            alt=""
          >

          <img
            class="field-icon-dark"
            src="{% static 'AppStoreLink/images/do-utilizador-dark.png' %}"
            alt=""
          >

          <input
            type="text"
            name="nome"
            placeholder="Nome"
            required
          >

        </label>

        <!-- #endregion -->


        <!-- #region sobrenome -->

        <label class="auth-field">

          <img
            class="field-icon-light"
            src="{% static 'AppStoreLink/images/do-utilizador.png' %}"
            alt=""
          >

          <img
            class="field-icon-dark"
            src="{% static 'AppStoreLink/images/do-utilizador-dark.png' %}"
            alt=""
          >

          <input
            type="text"
            name="sobrenome"
            placeholder="Sobrenome"
            required
          >

        </label>

        <!-- #endregion -->


        <!-- #region cpf -->

        <label class="auth-field">

          <img
            class="field-icon-light"
            src="{% static 'AppStoreLink/images/do-utilizador.png' %}"
            alt=""
          >

          <img
            class="field-icon-dark"
            src="{% static 'AppStoreLink/images/do-utilizador-dark.png' %}"
            alt=""
          >

          <input
            type="text"
            name="cpf"
            placeholder="CPF"
            required
          >

        </label>

        <!-- #endregion -->


        <!-- #region email -->

        <label class="auth-field">

          <img
            class="field-icon-light"
            src="{% static 'AppStoreLink/images/e-mail.png' %}"
            alt=""
          >

          <img
            class="field-icon-dark"
            src="{% static 'AppStoreLink/images/e-mail-dark.png' %}"
            alt=""
          >

          <input
            type="email"
            name="email"
            placeholder="E-mail"
            required
          >

        </label>

        <!-- #endregion -->


        <!-- #region telefone -->

        <label class="auth-field">

          <i
            class="bi bi-telephone-fill"
            aria-hidden="true"
          ></i>

          <input
            type="tel"
            name="telefone"
            placeholder="Número"
            required
          >

        </label>

        <!-- #endregion -->


        <!-- #region senha -->

        <label class="auth-field">

          <img
            class="field-icon-light"
            src="{% static 'AppStoreLink/images/bloqueado.png' %}"
            alt=""
          >

          <img
            class="field-icon-dark"
            src="{% static 'AppStoreLink/images/bloqueado-dark.png' %}"
            alt=""
          >

          <input
            type="password"
            name="senha"
            placeholder="Senha"
            required
          >

        </label>

        <!-- #endregion -->


        <button
          type="submit"
          class="auth-submit-btn"
        >
          CRIAR
        </button>


      </form>


    </div>


  </div>


</div>

<!-- #endregion -->


<!-- #region js modo escuro -->

<script>

  function atualizarBotaoTema() {

    const botao =
      document.querySelector(
        '.theme-toggle'
      );


    if (!botao) {
      return;
    }


    if (
      document.body.classList.contains('dark')
    ) {

      botao.innerHTML =
        '<i class="bi bi-sun-fill" aria-hidden="true"></i><span class="theme-label">Modo claro</span>';

    } else {

      botao.innerHTML =
        '<i class="bi bi-moon-fill" aria-hidden="true"></i><span class="theme-label">Modo escuro</span>';

    }

  }


  function toggleTheme() {

    document.body.classList.toggle('dark');


    const isDark =
      document.body.classList.contains('dark');


    localStorage.setItem(
      'theme',
      isDark ? 'dark' : 'light'
    );


    atualizarBotaoTema();

  }


  document.addEventListener(
    'DOMContentLoaded',
    function () {

      atualizarBotaoTema();

    }
  );

</script>

<!-- #endregion -->


</body>

</html>
