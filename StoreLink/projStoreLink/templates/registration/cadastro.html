{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StoreLink - Criar Conta</title>

<link rel="icon" type="image/png" href="{% static 'AppStoreLink/images/icon-dark.png' %}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="{% static 'AppStoreLink/styles/cadastro.css' %}">
<link rel="stylesheet" href="{% static 'AppStoreLink/styles/mensagens.css' %}">
</head>

<body>

<!-- #region modo escuro -->

<script>
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark');
  }
</script>

<button class="theme-toggle" onclick="toggleTheme(this)">
  🌙 Modo escuro
</button>

<!-- #endregion -->


<!-- #region mensagens -->

{% if messages %}

  <div class="messages-container">

    {% for message in messages %}

      <div class="alert alert-{{ message.tags }}">
        {{ message }}
      </div>

    {% endfor %}

  </div>

{% endif %}

<!-- #endregion -->


<!-- #region cadastro -->

<div class="auth-wrapper">


  <!-- #region arte -->

  <div class="auth-side">


    <button
      type="button"
      class="auth-side-icon"
      data-url="{% url 'index' %}"
      onclick="location.href=this.dataset.url"
      aria-label="Voltar para o início"
    >

      <img
        class="side-icon-light"
        src="{% static 'AppStoreLink/images/icon.png' %}"
        alt="StoreLink"
      >

      <img
        class="side-icon-dark"
        src="{% static 'AppStoreLink/images/icon-dark.png' %}"
        alt="StoreLink"
      >

    </button>


    <!-- faixas -->

    <span class="art-line art-line-amarelo"></span>

    <span class="art-line art-line-vermelho"></span>

    <span class="art-line art-line-verde"></span>

    <span class="art-line art-line-roxo"></span>

    <span class="art-line art-line-azul"></span>

    <span class="art-line art-line-ciano"></span>

    <span class="art-line art-line-laranja"></span>


    <!-- ícones -->

    <i class="bi bi-tools art-icon art-icon-construcao"></i>

    <i class="bi bi-flower1 art-icon art-icon-ambiente"></i>

    <i class="bi bi-fork-knife art-icon art-icon-alimentos"></i>

    <i class="bi bi-laptop art-icon art-icon-tecnologia"></i>

    <i class="bi bi-heart-pulse art-icon art-icon-saude"></i>

    <i class="bi bi-bone art-icon art-icon-pets"></i>

    <i class="bi bi-dribbble art-icon art-icon-esportes"></i>


    <div class="auth-side-content">

      <h1>
        Bem Vindo de Volta&nbsp;!
      </h1>

      <p>
        Insira seus dados pessoais para acessar sua conta
      </p>

      <a
        class="auth-btn-outline"
        href="{% url 'login' %}"
      >
        ENTRAR
      </a>

    </div>


  </div>

  <!-- #endregion -->


  <!-- #region formulario -->

  <div class="auth-form-side">

    <div class="auth-form-box">

      <h2>
        Criar Conta
      </h2>


      <button
        type="button"
        class="auth-google-btn"
        aria-label="Cadastrar com Google"
      >

        <img
          src="{% static 'AppStoreLink/images/google-plus.png' %}"
          alt="Google+"
        >

      </button>


      <form
        class="auth-form"
        method="POST"
        action=""
      >

        {% csrf_token %}


        <!-- #region nome -->

        <label class="auth-field">

          <img
            class="field-icon-light"
            src="{% static 'AppStoreLink/images/do-utilizador.png' %}"
            alt=""
          >

          <img
            class="field-icon-dark"
            src="{% static 'AppStoreLink/images/do-utilizador-dark.png' %}"
            alt=""
          >

          <input
            type="text"
            name="nome"
            placeholder="Nome"
            required
          >

        </label>

        <!-- #endregion -->


        <!-- #region sobrenome -->

        <label class="auth-field">

          <img
            class="field-icon-light"
            src="{% static 'AppStoreLink/images/do-utilizador.png' %}"
            alt=""
          >

          <img
            class="field-icon-dark"
            src="{% static 'AppStoreLink/images/do-utilizador-dark.png' %}"
            alt=""
          >

          <input
            type="text"
            name="sobrenome"
            placeholder="Sobrenome"
            required
          >

        </label>

        <!-- #endregion -->


        <!-- #region cpf -->

        <label class="auth-field">

          <img
            class="field-icon-light"
            src="{% static 'AppStoreLink/images/do-utilizador.png' %}"
            alt=""
          >

          <img
            class="field-icon-dark"
            src="{% static 'AppStoreLink/images/do-utilizador-dark.png' %}"
            alt=""
          >

          <input
            type="text"
            name="cpf"
            placeholder="CPF"
            required
          >

        </label>

        <!-- #endregion -->


        <!-- #region email -->

        <label class="auth-field">

          <img
            class="field-icon-light"
            src="{% static 'AppStoreLink/images/e-mail.png' %}"
            alt=""
          >

          <img
            class="field-icon-dark"
            src="{% static 'AppStoreLink/images/e-mail-dark.png' %}"
            alt=""
          >

          <input
            type="email"
            name="email"
            placeholder="E-mail"
            required
          >

        </label>

        <!-- #endregion -->


        <!-- #region telefone -->

        <label class="auth-field">

          <img
            class="telefone-icon"
            src="{% static 'AppStoreLink/images/telefone.png' %}"
            alt=""
          >

          <input
            type="tel"
            name="telefone"
            placeholder="Número"
            required
          >

        </label>

        <!-- #endregion -->


        <!-- #region senha -->

        <label class="auth-field">

          <img
            class="field-icon-light"
            src="{% static 'AppStoreLink/images/bloqueado.png' %}"
            alt=""
          >

          <img
            class="field-icon-dark"
            src="{% static 'AppStoreLink/images/bloqueado-dark.png' %}"
            alt=""
          >

          <input
            type="password"
            name="senha"
            placeholder="Senha"
            required
          >

        </label>

        <!-- #endregion -->


        <button
          type="submit"
          class="auth-submit-btn"
        >
          CRIAR
        </button>

      </form>

    </div>

  </div>

  <!-- #endregion -->


</div>

<!-- #endregion -->


<!-- #region js modo escuro -->

<script>

  function toggleTheme(btn) {

    document.body.classList.toggle('dark');

    var isDark =
      document.body.classList.contains('dark');

    localStorage.setItem(
      'theme',
      isDark ? 'dark' : 'light'
    );


    if (isDark) {

      btn.textContent =
        '☀️ Modo claro';

    } else {

      btn.textContent =
        '🌙 Modo escuro';

    }

  }


  document.addEventListener(
    'DOMContentLoaded',
    function () {

      var themeBtn =
        document.querySelector(
          '.theme-toggle'
        );


      if (
        themeBtn &&
        document.body.classList.contains('dark')
      ) {

        themeBtn.textContent =
          '☀️ Modo claro';

      }

    }
  );

</script>

<!-- #endregion -->

</body>
</html>
