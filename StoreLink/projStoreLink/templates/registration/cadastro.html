{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoreLink - Criar Conta</title>
<link rel="icon" type="image/png" href="{% static 'AppStoreLink/images/icon-dark.png' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'AppStoreLink/styles/cadastro.css' %}">
</head>
<body>

  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
    }
  </script>

  <button class="theme-toggle" onclick="toggleTheme(this)">🌙 Modo escuro</button>

  <div class="auth-wrapper">

    <div class="auth-side">
      <button type="button" class="auth-side-icon" data-url="{% url 'index' %}" onclick="location.href=this.dataset.url" aria-label="Voltar para o início">
        <img class="side-icon-light" src="{% static 'AppStoreLink/images/icon.png' %}" alt="StoreLink"><img class="side-icon-dark" src="{% static 'AppStoreLink/images/icon-dark.png' %}" alt="StoreLink">
      </button>

      <div class="auth-side-content">
        <h1>Bem Vindo de Volta&nbsp;!</h1>
        <p>Insira seus dados pessoais para acessar sua conta</p>
        <a class="auth-btn-outline" href="{% url 'login' %}">ENTRAR</a>
      </div>
    </div>

    <div class="auth-form-side">
      <div class="auth-form-box">
        <h2>Criar Conta</h2>

        <button type="button" class="auth-google-btn" aria-label="Cadastrar com Google">
          <img src="{% static 'AppStoreLink/images/google-plus.png' %}" alt="Google+">
        </button>

        <form class="auth-form" method="post" action="">
          {% csrf_token %}

          <label class="auth-field">
            <img class="field-icon-light" src="{% static 'AppStoreLink/images/do-utilizador.png' %}" alt=""><img class="field-icon-dark" src="{% static 'AppStoreLink/images/do-utilizador-dark.png' %}" alt="">
            <input type="text" name="nome" placeholder="Nome" required>
          </label>

          <label class="auth-field">
            <img class="field-icon-light" src="{% static 'AppStoreLink/images/e-mail.png' %}" alt=""><img class="field-icon-dark" src="{% static 'AppStoreLink/images/e-mail-dark.png' %}" alt="">
            <input type="email" name="email" placeholder="E-mail" required>
          </label>

          <label class="auth-field">
            <img class="field-icon-light" src="{% static 'AppStoreLink/images/bloqueado.png' %}" alt=""><img class="field-icon-dark" src="{% static 'AppStoreLink/images/bloqueado-dark.png' %}" alt="">
            <input type="password" name="senha" placeholder="Senha" required>
          </label>

          <button type="submit" class="auth-submit-btn">CRIAR</button>
        </form>
      </div>
    </div>

  </div>

  <script>
    function toggleTheme(btn) {
      document.body.classList.toggle('dark');
      var isDark = document.body.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      if (isDark) {
        btn.textContent = '☀️ Modo claro';
      } else {
        btn.textContent = '🌙 Modo escuro';
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      var themeBtn = document.querySelector('.theme-toggle');
      if (themeBtn && document.body.classList.contains('dark')) {
        themeBtn.textContent = '☀️ Modo claro';
      }
    });
  </script>

</body>
</html>
